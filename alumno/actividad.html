<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Actividad | Material Didáctico 2.0</title>
  <link rel="stylesheet" href="../assets/css/styles.css">
</head>
<body>
  <div class="app">
    <header class="topbar">
      <a class="brand" href="dashboard.html">
        <div class="brand-mark">📒</div>
        <div>
          <h1>Actividad</h1>
          <p data-user-name>Alumno</p>
        </div>
      </a>
      <nav class="nav">
        <a href="mrde.html">MRDE</a>
        <a href="dashboard.html">Módulos</a>
        <button class="btn" onclick="cerrarSesion()">Salir</button>
      </nav>
    </header>

    <section class="notebook activity-hero" id="actividadEncabezado">
      <div class="breadcrumb">Alumno · Actividad</div>
      <h2>Cargando actividad</h2>
      <p>Espera un momento.</p>
    </section>

    <section class="activity-tabs-wrap hidden" id="actividadTabsWrap">
      <button class="tab active" data-section-target="apuntes">Información</button>
      <button class="tab" data-section-target="diagramas">Diagramas</button>
      <button class="tab" data-section-target="ejemplo">Ejemplo</button>
      <button class="tab" data-section-target="ejercicios">Ejercicios</button>
      <button class="tab" data-section-target="practica">Práctica guiada</button>
      <button class="tab" data-section-target="evidencia">Evidencia</button>
    </section>

    <main id="actividadContenido" class="activity-notebook"></main>

    <section class="panel evidence-panel" id="evidencia">
      <div class="section-heading">
        <span class="label-pill">Entrega</span>
        <h3>Evidencia y reflexión del alumno</h3>
        <p>Responde con tus propias palabras. El sistema analizará tu razonamiento, tu procedimiento y la coherencia con la evidencia que entregues.</p>
      </div>
      <form id="formEntrega" class="form">
        <label class="field"><span>Análisis del problema</span><textarea class="textarea" id="analisisTexto" required placeholder="Explica qué situación resolviste, qué observaste y qué revisaste primero."></textarea></label>
        <label class="field"><span>Procedimiento realizado</span><textarea class="textarea" id="procedimientoTexto" required placeholder="Describe los pasos que seguiste. Incluye comandos, verificaciones y decisiones."></textarea></label>
        <label class="field"><span>Reflexión final</span><textarea class="textarea" id="reflexionTexto" required placeholder="Explica qué aprendiste y qué harías si el resultado no funcionara."></textarea></label>
        <label class="field"><span>Archivo de evidencia</span><input class="input" type="file" id="entregaArchivo" accept=".pkt,.pdf,.png,.jpg,.jpeg,.zip,.doc,.docx"></label>
        <div id="revisionPrevia" class="feedback-box hidden"></div>
        <div class="actions"><button class="btn primary" type="submit">Enviar evidencia</button></div>
      </form>
      <div id="entregaStatus" class="status hidden"></div>
    </section>
  </div>
  <script src="../assets/js/config.js?v=20260527-2"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../assets/js/auth.js?v=20260527-2"></script>
  <script>protegerPagina('alumno')</script>
  <script src="../assets/js/actividad.js?v=20260527-2"></script>
</body>
</html>
