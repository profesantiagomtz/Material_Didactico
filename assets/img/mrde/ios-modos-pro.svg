<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520"><defs><style>.box{fill:#fff8e7;stroke:#111;stroke-width:5}.cmd{fill:#111827;stroke:#111;stroke-width:4}.txt{font-family:Arial,sans-serif;font-weight:700;fill:#111}.mono{font-family:monospace;font-weight:700;fill:#d1fae5}.arr{stroke:#2e7d4f;stroke-width:8;fill:none;marker-end:url(#a)}</style><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#2e7d4f"/></marker></defs><rect width="900" height="520" fill="#f5f1e8"/><rect x="70" y="60" width="220" height="120" rx="24" class="box"/><text x="180" y="100" text-anchor="middle" class="txt" font-size="26">EXEC usuario</text><rect x="100" y="125" width="160" height="38" rx="10" class="cmd"/><text x="122" y="151" class="mono" font-size="23">Router&gt;</text><rect x="340" y="60" width="220" height="120" rx="24" class="box"/><text x="450" y="100" text-anchor="middle" class="txt" font-size="26">Privilegiado</text><rect x="370" y="125" width="160" height="38" rx="10" class="cmd"/><text x="392" y="151" class="mono" font-size="23">Router#</text><rect x="610" y="60" width="230" height="120" rx="24" class="box"/><text x="725" y="100" text-anchor="middle" class="txt" font-size="26">Config global</text><rect x="635" y="125" width="180" height="38" rx="10" class="cmd"/><text x="650" y="151" class="mono" font-size="21">Router(config)#</text><path d="M290 120 H340" class="arr"/><text x="302" y="96" class="txt" font-size="20">enable</text><path d="M560 120 H610" class="arr"/><text x="552" y="96" class="txt" font-size="20">conf t</text><rect x="95" y="270" width="710" height="150" rx="24" fill="#e7eef9" stroke="#111" stroke-width="4"/><text x="125" y="310" class="txt" font-size="26">Idea para recordar</text><text x="125" y="350" class="txt" font-size="22">El prompt te dice dónde estás. Si el comando falla, revisa primero el modo IOS.</text><text x="125" y="390" class="txt" font-size="22">Para configurar: Router&gt; ena