<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" role="img" aria-label="Diagrama de modos de operación del IOS">
  <rect width="900" height="520" fill="#f5f1e8"/>
  <defs><pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M 24 0 L 0 0 0 24" fill="none" stroke="#c8d0dc" stroke-width="1" opacity=".55"/></pattern><filter id="shadow"><feDropShadow dx="5" dy="5" stdDeviation="0" flood-color="#1a1a1a"/></filter></defs>
  <rect width="900" height="520" fill="url(#grid)"/>
  <text x="44" y="55" font-family="Arial" font-size="28" font-weight="700">Escalera de modos IOS</text>
  <g font-family="Arial" filter="url(#shadow)">
    <rect x="95" y="105" width="710" height="78" rx="16" fill="#fffaf0" stroke="#1a1a1a" stroke-width="4"/>
    <text x="130" y="139" font-size="22" font-weight="700">EXEC de usuario</text><text x="130" y="165" font-size="18" fill="#555">Prompt: Router&gt; · Permisos limitados</text>
    <rect x="95" y="225" width="710" height="78" rx="16" fill="#fffaf0" stroke="#1a1a1a" stroke-width="4"/>
    <text x="130" y="259" font-size="22" font-weight="700">EXEC privilegiado</text><text x="130" y="285" font-size="18" fill="#555">Prompt: Router# · Revisar configuración y ejecutar comandos show</text>
    <rect x="95" y="345" width="710" height="78" rx="16" fill="#fffaf0" stroke="#1a1a1a" stroke-width="4"/>
    <text x="130" y="379" font-size="22" font-weight="700">Configuración global</text><text x="130" y="405" font-size="18" fill="#555">Prompt: Router(config)# · Cambiar parámetros del dispositivo</text>
  </g>
  <g stroke="#2b4c7e" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M450 185 v32"/><path d="M438 205 l12 12 12-12"/>
    <path d="M450 305 v32"/><path d="M438 325 l12 12 12-12"/>
  </g>
  <text x="470" y="213" font-family="Arial" font-size="20" font-weight="700" fill="#2b4c7e">enable</text>
  <text x="470" y="333" font-family="Arial" font-size="20" font-weight="700" fill="#2b4c7e">configure terminal</text>
</svg>
