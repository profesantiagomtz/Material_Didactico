<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520"><defs><style>.dev{fill:#fff8e7;stroke:#111;stroke-width:5}.router{fill:#ddefe4}.sw{fill:#e7eef9}.pc{fill:#fff3d7}.txt{font-family:Arial,sans-serif;font-weight:700;fill:#111}.line{stroke:#111;stroke-width:5}.ip{font-family:monospace;fill:#2b4c7e;font-weight:700}</style></defs><rect width="900" height="520" fill="#f5f1e8"/><rect x="340" y="60" width="220" height="115" rx="24" class="dev router"/><text x="450" y="105" text-anchor="middle" class="txt" font-size="30">Router R611</text><text x="450" y="145" text-anchor="middle" class="ip" font-size="20">CLI / IOS</text><rect x="340" y="235" width="220" height="100" rx="22" class="dev sw"/><text x="450" y="295" text-anchor="middle" class="txt" font-size="30">Switch</text><rect x="100" y="390" width="190" height="90" rx="18" class="dev pc"/><text x="195" y="445" text-anchor="middle" class="txt" font-size="26">PC1</text><rect x="610" y="390" width="190" height="90" rx="18" class="dev pc"/><text x="705" y="445" text-anchor="middle" class="txt" font-size="26">PC2</text><path d="M450 175 V235" class="line"/><path d="M450 335 V365 H195 V390" class="line"/><path d="M450 365 H705 V390" class="line"/><text x="80" y="65" class="txt" font-size="24">Escenario de práctica</text><text x="80" y="100" class="txt" font-size="20">Primero se domina CLI e IOS. Después se configuran interfaces y conectividad.</text></svg>