<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 520" role="img" aria-label="Topología LAN básica con router switch y dos computadoras">
  <rect width="980" height="520" fill="#f5f1e8"/>
  <defs><pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M 24 0 L 0 0 0 24" fill="none" stroke="#c8d0dc" stroke-width="1" opacity=".55"/></pattern><filter id="shadow"><feDropShadow dx="5" dy="5" stdDeviation="0" flood-color="#1a1a1a"/></filter></defs>
  <rect width="980" height="520" fill="url(#grid)"/>
  <text x="44" y="55" font-family="Arial" font-size="28" font-weight="700">Topología de práctica: conectividad básica LAN</text>
  <g stroke="#1a1a1a" stroke-width="6" fill="none" stroke-linecap="round"><path d="M490 165 v95"/><path d="M490 335 v75"/><path d="M380 335 h220"/><path d="M270 410 h220"/><path d="M710 410 H490"/></g>
  <g filter="url(#shadow)" font-family="Arial">
    <rect x="365" y="95" width="250" height="70" rx="18" fill="#fffaf0" stroke="#1a1a1a" stroke-width="4"/>
    <text x="490" y="126" text-anchor="middle" font-size="22" font-weight="700">Router R1</text><text x="490" y="150" text-anchor="middle" font-size="16">G0/0: 192.168.10.1</text>
    <rect x="370" y="260" width="240" height="75" rx="18" fill="#fffaf0" stroke="#1a1a1a" stroke-width="4"/>
    <text x="490" y="293" text-anchor="middle" font-size="22" font-weight="700">Switch S1</text><text x="490" y="317" text-anchor="middle" font-size="16">Puertos de acceso</text>
    <rect x="135" y="385" width="150" height="78" rx="14" fill="#dbeafe" stroke="#1a1a1a" stroke-width="4"/>
    <text x="210" y="418" text-anchor="middle" font-size="21" font-weight="700">PC1</text><text x="210" y="443" text-anchor="middle" font-size="15">192.168.10.10</text>
    <rect x="695" y="385" width="150" height="78" rx="14" fill="#dbeafe" stroke="#1a1a1a" stroke-width="4"/>
    <text x="770" y="418" text-anchor="middle" font-size="21" font-weight="700">PC2</text><text x="770" y="443" text-anchor="middle" font-size="15">192.168.10.11</text>
  </g>
</svg>
